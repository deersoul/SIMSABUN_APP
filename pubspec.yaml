name: simsabun
description: 심령사진 분류 아르바이트 Android 웹뷰 앱.
publish_to: 'none'
version: 1.0.4+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/fonts/OFL.txt
  fonts:
    - family: NanumMyeongjo
      fonts:
        - asset: assets/fonts/NanumMyeongjo-Regular.ttf

